[tool.poetry]
name = "trilha-api"
version = "0.1.0"
description = "API da plataforma educacional Trilha"
authors = ["Trilha"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.0"
uvicorn = { version = "^0.35.0", extras = ["standard"] }
pydantic-settings = "^2.10.0"
sqlalchemy = "^2.0.41"
alembic = "^1.16.0"
psycopg = { version = "^3.2.9", extras = ["binary"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^1.0.0"
httpx = "^0.28.1"
ruff = "^0.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

