services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trilha}
      POSTGRES_USER: ${POSTGRES_USER:-trilha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trilha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trilha} -d ${POSTGRES_DB:-trilha}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trilha}:${POSTGRES_PASSWORD:-trilha}@db:5432/${POSTGRES_DB:-trilha}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:

